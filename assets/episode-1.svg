<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Phone showing a glucose trend line beside a clock and a glucose drop">
  <!-- Episode 1: A day with digital healthcare -->
  <circle cx="120" cy="120" r="96" fill="#fff" opacity=".28"/>
  <circle cx="120" cy="120" r="70" fill="#fff" opacity=".25"/>
  <!-- phone -->
  <rect x="78" y="44" width="84" height="152" rx="16" fill="#fff" stroke="#0A5C63" stroke-width="4"/>
  <rect x="106" y="52" width="28" height="5" rx="2.5" fill="#0A5C63" opacity=".35"/>
  <!-- glucose chart -->
  <rect x="90" y="70" width="60" height="50" rx="8" fill="#E6F6F4"/>
  <polyline points="94,106 104,100 112,104 120,88 128,94 136,84 146,90" fill="none" stroke="#0E7C86" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="136" cy="84" r="4" fill="#FF6B6B"/>
  <!-- list rows -->
  <rect x="90" y="132" width="60" height="10" rx="5" fill="#EAF3FB"/>
  <rect x="90" y="148" width="44" height="10" rx="5" fill="#EAF3FB"/>
  <rect x="90" y="164" width="52" height="10" rx="5" fill="#EAF3FB"/>
  <circle cx="96" cy="137" r="3" fill="#1F6FB2"/>
  <circle cx="96" cy="153" r="3" fill="#0E7C86"/>
  <circle cx="96" cy="169" r="3" fill="#FF6B6B"/>
  <!-- clock -->
  <circle cx="178" cy="70" r="22" fill="#fff" stroke="#0A5C63" stroke-width="4"/>
  <path d="M178 58v13l8 5" fill="none" stroke="#0E7C86" stroke-width="4" stroke-linecap="round"/>
  <!-- glucose drop -->
  <path d="M58 132c0 0-18 20-18 32a18 18 0 0 0 36 0c0-12-18-32-18-32z" fill="#FF6B6B" stroke="#0A5C63" stroke-width="4" stroke-linejoin="round"/>
  <path d="M52 162a7 7 0 0 0 6 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <!-- notification bell -->
  <circle cx="176" cy="150" r="16" fill="#FF6B6B"/>
  <path d="M170 154h12l-2-3v-5a4 4 0 0 0-8 0v5z" fill="#fff"/>
  <circle cx="176" cy="157" r="2" fill="#fff"/>
</svg>
