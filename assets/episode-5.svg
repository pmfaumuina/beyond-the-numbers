<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Three people of different ages standing together under a heart">
  <!-- Episode 5: Who gets left out? -->
  <circle cx="120" cy="124" r="96" fill="#fff" opacity=".4"/>
  <!-- heart -->
  <path d="M120 70c-8-16-34-14-34 6 0 16 22 28 34 38 12-10 34-22 34-38 0-20-26-22-34-6z" fill="#FF6B6B" stroke="#0A5C63" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="94,86 106,86 112,76 120,96 126,84 146,84" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- left person (older adult with cane) -->
  <circle cx="62" cy="128" r="14" fill="#fff" stroke="#0A5C63" stroke-width="4"/>
  <path d="M38 196v-20a24 24 0 0 1 48 0v20z" fill="#1F6FB2" stroke="#0A5C63" stroke-width="4" stroke-linejoin="round"/>
  <path d="M90 168v32" stroke="#0A5C63" stroke-width="4" stroke-linecap="round"/>
  <path d="M84 168h6" stroke="#0A5C63" stroke-width="4" stroke-linecap="round"/>
  <!-- center person -->
  <circle cx="120" cy="138" r="16" fill="#fff" stroke="#0A5C63" stroke-width="4"/>
  <path d="M92 208v-22a28 28 0 0 1 56 0v22z" fill="#0E7C86" stroke="#0A5C63" stroke-width="4" stroke-linejoin="round"/>
  <!-- right person -->
  <circle cx="178" cy="128" r="14" fill="#fff" stroke="#0A5C63" stroke-width="4"/>
  <path d="M154 196v-20a24 24 0 0 1 48 0v20z" fill="#FFB39B" stroke="#0A5C63" stroke-width="4" stroke-linejoin="round"/>
  <!-- speech bubble (language) -->
  <path d="M184 72h32a8 8 0 0 1 8 8v16a8 8 0 0 1-8 8h-18l-10 8v-8h-4a8 8 0 0 1-8-8V80a8 8 0 0 1 8-8z" fill="#fff" stroke="#0A5C63" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="200" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1F6FB2">Aa</text>
  <!-- ground -->
  <line x1="30" y1="210" x2="210" y2="210" stroke="#0A5C63" stroke-width="4" stroke-linecap="round" opacity=".4"/>
</svg>
