    <rect x="30" y="58" width="40" height="26" rx="6"/>
    <rect x="172" y="64" width="40" height="26" rx="6"/>
    <rect x="24" y="152" width="40" height="26" rx="6"/>
    <rect x="178" y="158" width="40" height="26" rx="6"/>
  </g>
  <g fill="#0E7C86"><circle cx="42" cy="71" r="4"/><circle cx="184" cy="77" r="4"/><circle cx="36" cy="165" r="4"/><circle cx="190" cy="171" r="4"/></g>
  <g stroke="#0A5C63" stroke-width="3" stroke-linecap="round"><line x1="50" y1="71" x2="62" y2="71"/><line x1="192" y1="77" x2="204" y2="77"/><line x1="44" y1="165" x2="56" y2="165"/><line x1="198" y1="171" x2="210" y2="171"/></g>
