<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Video call screen with a heart, connected to a chat bubble">
  <!-- Episode 6: Keeping care human -->
  <circle cx="120" cy="120" r="96" fill="#fff" opacity=".28"/>
  <circle cx="120" cy="120" r="70" fill="#fff" opacity=".25"/>
  <!-- tablet / video visit -->
  <rect x="46" y="62" width="120" height="88" rx="14" fill="#fff" stroke="#7A2E4A" stroke-width="4"/>
  <rect x="56" y="72" width="100" height="62" rx="8" fill="#FDE8EE"/>
  <!-- clinician silhouette -->
  <circle cx="106" cy="94" r="11" fill="#C2456E"/>
  <path d="M86 128a20 16 0 0 1 40 0z" fill="#C2456E"/>
  <!-- small self view -->
  <rect x="132" y="112" width="18" height="16" rx="4" fill="#fff" stroke="#7A2E4A" stroke-width="2.5"/>
  <circle cx="141" cy="118" r="3" fill="#1F6FB2"/>
  <!-- chat bubble -->
  <path d="M150 150h52a10 10 0 0 1 10 10v22a10 10 0 0 1-10 10h-30l-12 12v-12h-10a10 10 0 0 1-10-10v-22a10 10 0 0 1 10-10z" fill="#fff" stroke="#7A2E4A" stroke-width="4" stroke-linejoin="round"/>
  <rect x="152" y="164" width="40" height="6" rx="3" fill="#F4C7D5"/>
  <rect x="152" y="176" width="26" height="6" rx="3" fill="#F4C7D5"/>
  <!-- heart -->
  <path d="M182 74s-20-12-20-26a11 11 0 0 1 20-6 11 11 0 0 1 20 6c0 14-20 26-20 26z" fill="#FF6B6B" stroke="#7A2E4A" stroke-width="4" stroke-linejoin="round"/>
  <!-- pulse line under the tablet -->
  <polyline points="40,176 66,176 74,166 84,190 94,170 100,176 128,176" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
